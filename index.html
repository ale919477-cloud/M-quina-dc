<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Motor DC - Análisis Avanzado Dinámico</title>
    <!-- Librería de Gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .main-container { width: 95%; max-width: 1350px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 20px;}
        
        .layout { display: flex; gap: 20px; flex-wrap: wrap; }
        .left-panel { flex: 1; min-width: 380px; display: flex; flex-direction: column; gap: 15px; }
        .right-panel { flex: 2; min-width: 500px; display: flex; flex-direction: column; gap: 15px; }

        .section-box { background: #e9ecef; padding: 15px; border-radius: 8px; border: 1px solid #ced4da; }
        .section-title { font-size: 14px; font-weight: bold; color: #495057; margin-bottom: 10px; border-bottom: 2px solid #adb5bd; padding-bottom: 5px; }
        
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 10px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 11px; font-weight: bold; color: #333; margin-bottom: 3px; }
        .input-group input, .input-group select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; background: white; }
        
        .wave-info-box { display: flex; align-items: center; gap: 12px; background: #fff; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-top: 10px; min-height: 55px; }
        .wave-icon { width: 60px; height: 35px; flex-shrink: 0; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; padding: 2px; }
        .wave-text { font-size: 11px; color: #444; line-height: 1.3; }
        .wave-text strong { color: #007bff; display: block; margin-bottom: 2px; font-size: 12px; }

        .btn { border: none; padding: 8px 10px; font-size: 12px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: background 0.3s; color: white; flex: 1; text-align: center; }
        .btn-calc { background: #17a2b8; }
        .btn-calc:hover { background: #138496; }
        .btn-insert { background: #fd7e14; }
        .btn-insert:hover { background: #e26b0b; }
        .btn-save { background: #28a745; }
        .btn-save:hover { background: #218838; }
        .btn-save:disabled { background: #6c757d; cursor: not-allowed; opacity: 0.6; }
        
        .action-buttons { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

        .btn-compare { background: #6f42c1; width: 100%; padding: 10px; margin-top: 10px; font-size: 13px;}
        .btn-compare:hover { background: #59339d; }
        .btn-show { background: #007bff; font-size: 11px; padding: 4px 8px; }
        .btn-show:hover { background: #0056b3; }
        .btn-delete { background: #dc3545; font-size: 11px; padding: 4px 8px; }
        .btn-delete:hover { background: #c82333; }

        .table-wrapper { max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; margin-top: 10px; background: white;}
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
        th, td { padding: 8px; border-bottom: 1px solid #ddd; }
        th { background-color: #343a40; color: white; position: sticky; top: 0; }
        
        .chart-container { display: flex; flex-direction: column; height: 280px; width: 100%; background: #fff; border: 1px solid #eee; border-radius: 6px; padding: 10px; box-sizing: border-box; }
        .canvas-wrapper { flex: 1; position: relative; min-height: 0; }
        .chart-caption { text-align: center; font-size: 11.5px; color: #555; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ddd; }
        .chart-caption strong { color: #2c3e50; }
    </style>
</head>
<body>

<div class="main-container">
    <h2>Simulador Dinámico: Motor DC</h2>
    
    <div class="layout">
        <div class="left-panel">
            <!-- 1. Datos Iniciales -->
            <div class="section-box">
                <div class="section-title">1. Datos Iniciales del Motor</div>
                <div class="grid-inputs">
                    <div class="input-group"><label>R_a (Ω)</label><input type="number" id="r_a" placeholder="2.2" step="any"></div>
                    <div class="input-group"><label>L_a (H)</label><input type="number" id="l_a" placeholder="0.45" step="any"></div>
                    <div class="input-group"><label>V_f (V)</label><input type="number" id="v_f" placeholder="15" step="any"></div>
                    <div class="input-group"><label>R_f (Ω)</label><input type="number" id="r_f" placeholder="12" step="any"></div>
                    <div class="input-group"><label>J (kg·m²)</label><input type="number" id="j" placeholder="0.003" step="any"></div>
                    <div class="input-group"><label>B (N·m·s)</label><input type="number" id="b" placeholder="0.002" step="any"></div>
                    <div class="input-group"><label>K_t</label><input type="number" id="k_t" placeholder="0.15" step="any"></div>
                    <div class="input-group"><label>K_v</label><input type="number" id="k_v" placeholder="0.15" step="any"></div>
                </div>
            </div>

            <!-- 2. Datos de Simulación -->
            <div class="section-box">
                <div class="section-title">2. Configuración de Tensión y Carga</div>
                <div class="grid-inputs">
                    <div class="input-group" style="grid-column: span 2;">
                        <label>Tipo de Señal V_a</label>
                        <select id="signal_type" onchange="actualizarInfoOnda()">
                            <option value="step">Escalón Unitario</option>
                            <option value="ramp">Rampa</option>
                            <option value="square">Onda Cuadrada</option>
                            <option value="sine">Onda Senoidal</option>
                            <option value="triangle">Onda Triangular</option>
                            <option value="peru">Onda Rectificada</option>
                        </select>
                    </div>

                    <div class="input-group"><label>Amplitud Tensión (V)</label><input type="number" id="v_a" value="24" step="any"></div>
                    
                    <!-- CAMPOS DINÁMICOS: ESCALÓN -->
                    <div class="input-group dyn-field" id="grp_start_step">
                        <label>Inicio Escalón (s)</label>
                        <input type="number" id="t_start_step" value="0" step="any" title="Segundo en el que ingresa el escalón de voltaje">
                    </div>
                    
                    <!-- CAMPOS DINÁMICOS: RAMPA -->
                    <div class="input-group dyn-field" id="grp_start_ramp" style="display: none;">
                        <label>Inicio Rampa (s)</label>
                        <input type="number" id="t_start_ramp" value="0" step="any">
                    </div>
                    <div class="input-group dyn-field" id="grp_end_ramp" style="display: none;">
                        <label>Fin Rampa (s)</label>
                        <input type="number" id="t_end_ramp" value="1.5" step="any">
                    </div>

                    <!-- CAMPOS DINÁMICOS: ONDAS PERIÓDICAS -->
                    <div class="input-group dyn-field" id="grp_period" style="display: none;">
                        <label>Periodo (s)</label>
                        <input type="number" id="period_v" value="2" step="any">
                    </div>
                    <div class="input-group dyn-field" id="grp_polarity" style="display: none;">
                        <label>Polaridad</label>
                        <select id="polarity_v">
                            <option value="unipolar">Solo Positivo (0 a +V)</option>
                            <option value="bipolar">Positivo y Negativo (-V a +V)</option>
                        </select>
                    </div>
                    
                    <!-- Carga General (Siempre visible) -->
                    <div class="input-group"><label>Par Carga T_L (N·m)</label><input type="number" id="t_l" value="0.3" step="any"></div>
                    <div class="input-group"><label>Inicio Carga (s)</label><input type="number" id="t_load" value="0" step="any"></div>
                </div>

                <div class="wave-info-box" id="wave-info-box">
                    <!-- Se llena dinámicamente -->
                </div>

                <div class="action-buttons">
                    <button class="btn btn-calc" onclick="calcularGrafica(false)">Calcular Sin Carga</button>
                    <button class="btn btn-insert" onclick="calcularGrafica(true)">Calcular Con Carga</button>
                    <button class="btn btn-save" id="btnGuardar" onclick="guardarSimulacion()" disabled>Guardar</button>
                </div>
            </div>

            <!-- 3. Tabla de Resultados -->
            <div class="section-box">
                <div class="section-title">3. Simulaciones Guardadas</div>
                <div class="table-wrapper">
                    <table id="resultsTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Onda</th>
                                <th>V_a</th>
                                <th>T_L</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                </div>
                <button class="btn btn-compare" onclick="compararGraficosAnimados()">▶ Comparar Gráficos Animados</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="chart-container"><div class="canvas-wrapper"><canvas id="chartVa"></canvas></div><div class="chart-caption"><strong>Gráfica de Tensión de Armadura (Va)</strong></div></div>
            <div class="chart-container"><div class="canvas-wrapper"><canvas id="chartW"></canvas></div><div class="chart-caption"><strong>Gráfica de Velocidad Angular (ω)</strong></div></div>
            <div class="chart-container"><div class="canvas-wrapper"><canvas id="chartIa"></canvas></div><div class="chart-caption"><strong>Gráfica de Corriente de Armadura (Ia)</strong></div></div>
        </div>
    </div>
</div>

<script>
    let chartVaInstance = null; let chartWInstance = null; let chartIaInstance = null;
    let savedSimulations = []; let simIdCounter = 1; let simulacionActual = null; let animacionInterval = null;
    const colors = ['#007bff', '#dc3545', '#28a745', '#ffc107', '#6f42c1', '#fd7e14', '#20c997', '#e83e8c'];

    const waveInfoData = {
        'step': { svg: '<svg viewBox="0 0 40 20" class="wave-icon"><polyline points="2,18 12,18 12,2 38,2" fill="none" stroke="#007bff" stroke-width="2.5"/></svg>', title: 'Escalón Unitario', desc: 'Aplica la tensión de forma instantánea en el segundo exacto que configures.' },
        'ramp': { svg: '<svg viewBox="0 0 40 20" class="wave-icon"><polyline points="2,18 8,18 32,2 38,2" fill="none" stroke="#007bff" stroke-width="2.5"/></svg>', title: 'Rampa', desc: 'Asciende progresivamente desde el "Inicio Rampa" hasta alcanzar su máximo en el "Fin Rampa".' },
        'square': { svg: '<svg viewBox="0 0 40 20" class="wave-icon"><polyline points="2,18 6,18 6,2 18,2 18,18 30,18 30,2 38,2" fill="none" stroke="#007bff" stroke-width="2.5"/></svg>', title: 'Onda Cuadrada', desc: 'Alterna bruscamente evaluando el Periodo. Puedes elegir si incluye fase negativa.' },
        'sine': { svg: '<svg viewBox="0 0 40 20" class="wave-icon"><path d="M 2 10 Q 11 -6 20 10 Q 29 26 38 10" fill="none" stroke="#007bff" stroke-width="2.5"/></svg>', title: 'Onda Senoidal', desc: 'Señal alterna. Controla el Periodo y si evalúas la fase negativa o rectificada unipolar.' },
        'triangle': { svg: '<svg viewBox="0 0 40 20" class="wave-icon"><polyline points="2,18 11,2 20,18 29,2 38,18" fill="none" stroke="#007bff" stroke-width="2.5"/></svg>', title: 'Onda Triangular', desc: 'Ascenso y descenso lineal respetando el Periodo configurado.' },
        'peru': { svg: '<svg viewBox="0 0 40 20" class="wave-icon"><path d="M 2 18 Q 7 2 12 18 Q 17 2 22 18 Q 27 2 32 18 Q 36 2 38 18" fill="none" stroke="#007bff" stroke-width="2.5"/></svg>', title: 'Rectificada Completa', desc: 'Rizado continuo de red a 120Hz.' }
    };

    function actualizarInfoOnda() {
        const type = document.getElementById('signal_type').value;
        const info = waveInfoData[type];
        document.getElementById('wave-info-box').innerHTML = `${info.svg}<div class="wave-text"><strong>📌 ${info.title}</strong>${info.desc}</div>`;

        // 1. Ocultar TODOS los campos dinámicos
        document.querySelectorAll('.dyn-field').forEach(el => el.style.display = 'none');

        // 2. Mostrar EXCLUSIVAMENTE los que pertenecen a la onda seleccionada
        if (type === 'step') {
            document.getElementById('grp_start_step').style.display = 'flex';
        } else if (type === 'ramp') {
            document.getElementById('grp_start_ramp').style.display = 'flex';
            document.getElementById('grp_end_ramp').style.display = 'flex';
        } else if (type === 'square' || type === 'sine' || type === 'triangle') {
            document.getElementById('grp_period').style.display = 'flex';
            document.getElementById('grp_polarity').style.display = 'flex';
        }
    }

    function initCharts() {
        if (typeof Chart === 'undefined') return;
        const commonOptions = { responsive: true, maintainAspectRatio: false, animation: false, elements: { point: { radius: 0, hitRadius: 5 } }, interaction: { mode: 'index', intersect: false } };
        chartVaInstance = new Chart(document.getElementById('chartVa').getContext('2d'), { type: 'line', data: { datasets: [] }, options: Object.assign({}, commonOptions, { scales: { x: { title: { display: true, text: 'Tiempo (s)' } }, y: { title: { display: true, text: 'Voltaje Va (V)' } } } }) });
        chartWInstance = new Chart(document.getElementById('chartW').getContext('2d'), { type: 'line', data: { datasets: [] }, options: Object.assign({}, commonOptions, { scales: { x: { title: { display: true, text: 'Tiempo (s)' } }, y: { title: { display: true, text: 'Velocidad ω (rad/s)' } } } }) });
        chartIaInstance = new Chart(document.getElementById('chartIa').getContext('2d'), { type: 'line', data: { datasets: [] }, options: Object.assign({}, commonOptions, { scales: { x: { title: { display: true, text: 'Tiempo (s)' } }, y: { title: { display: true, text: 'Corriente Ia (A)' } } } }) });
    }

    function obtenerDatos() {
        const defs = { 'r_a': 2.2, 'l_a': 0.45, 'v_f': 15, 'r_f': 12, 'j': 0.003, 'b': 0.002, 'k_t': 0.15, 'k_v': 0.15, 'v_a': 24, 't_l': 0.3, 't_load': 0, 't_start_step': 0, 't_start_ramp': 0, 't_end_ramp': 1.5, 'period_v': 2 };
        const v = {};
        for (let id in defs) {
            let el = document.getElementById(id); let val = el.value;
            if (val === '' || isNaN(val)) { val = defs[id]; el.value = val; }
            v[id] = parseFloat(val);
        }
        v.signal_type = document.getElementById('signal_type').value;
        v.signal_name = waveInfoData[v.signal_type].title;
        v.polarity_v = document.getElementById('polarity_v') ? document.getElementById('polarity_v').value : 'unipolar';
        return v;
    }

    function ejecutarModelo(p, conCarga) {
        const If = p.v_f / p.r_f;
        const dt = (p.signal_type === 'peru' || p.period_v < 0.1) ? 0.0002 : 0.001; 
        let T_sim = p.signal_type === 'peru' ? 0.2 : 6; 

        let ia = 0, w = 0, t = 0;
        const dataVa = [], dataW = [], dataIa = [];
        const saveStep = dt < 0.001 ? (0.001 / dt) : (0.01 / dt);

        // Controlamos el tiempo de inicio exclusivo
        let t_start_v = 0;
        if (p.signal_type === 'step') t_start_v = p.t_start_step;
        else if (p.signal_type === 'ramp') t_start_v = p.t_start_ramp;

        if ((p.signal_type === 'step' || p.signal_type === 'square') && t_start_v === 0) dataVa.push({ x: 0, y: 0 });

        for (let i = 0; i <= T_sim / dt; i++) {
            t = i * dt;
            let va_t = 0;

            if (t >= t_start_v) {
                let t_v = t - t_start_v; // Tiempo de cálculo interno de la onda
                
                switch(p.signal_type) {
                    case 'step': 
                        va_t = p.v_a; 
                        break;
                    case 'square': 
                        let cycle_sq = t_v % p.period_v;
                        va_t = (cycle_sq < p.period_v / 2) ? p.v_a : (p.polarity_v === 'bipolar' ? -p.v_a : 0);
                        break;
                    case 'ramp': 
                        let ramp_duration = p.t_end_ramp - p.t_start_ramp;
                        if (ramp_duration <= 0) ramp_duration = 0.001; 
                        va_t = t_v <= ramp_duration ? (p.v_a / ramp_duration) * t_v : p.v_a; 
                        break;
                    case 'triangle': 
                        let norm_tr = (t_v % p.period_v) / p.period_v;
                        if (p.polarity_v === 'unipolar') {
                            va_t = norm_tr < 0.5 ? 2 * p.v_a * norm_tr : 2 * p.v_a * (1 - norm_tr);
                        } else {
                            if (norm_tr < 0.25) va_t = 4 * p.v_a * norm_tr;
                            else if (norm_tr < 0.75) va_t = p.v_a - 4 * p.v_a * (norm_tr - 0.25);
                            else va_t = -p.v_a + 4 * p.v_a * (norm_tr - 0.75);
                        }
                        break;
                    case 'sine':
                        let wt = 2 * Math.PI * (1 / p.period_v) * t_v;
                        va_t = p.v_a * Math.sin(wt);
                        if (p.polarity_v === 'unipolar') va_t = Math.max(0, va_t);
                        break;
                    case 'peru': 
                        va_t = p.v_a * Math.abs(Math.sin(2 * Math.PI * 60 * t_v)); 
                        break;
                }
            } else {
                va_t = 0; // Antes de iniciar, el voltaje es cero
            }

            let current_tl = 0;
            if (conCarga) {
                let t_load_start = p.t_load;
                let trans_duration = p.signal_type === 'peru' ? 0.02 : 1.0; 
                if (t >= t_load_start && t <= t_load_start + trans_duration) {
                    current_tl = p.t_l * ((t - t_load_start) / trans_duration); 
                } else if (t > t_load_start + trans_duration) {
                    current_tl = p.t_l; 
                }
            }

            let dia_dt = (va_t - p.r_a * ia - p.k_v * w * If) / p.l_a;
            let dw_dt = (p.k_t * If * ia - p.b * w - current_tl) / p.j;

            if (w < 0 && dw_dt < 0 && va_t === 0) { w = 0; dw_dt = 0; }

            ia += dia_dt * dt; w += dw_dt * dt;

            if (i % Math.round(saveStep) === 0) { 
                dataVa.push({ x: parseFloat(t.toFixed(4)), y: parseFloat(va_t.toFixed(2)) });
                dataW.push({ x: parseFloat(t.toFixed(4)), y: w });
                dataIa.push({ x: parseFloat(t.toFixed(4)), y: ia });
            }
        }
        return { dataVa, dataW, dataIa };
    }

    function calcularGrafica(conCarga) {
        if (animacionInterval) clearInterval(animacionInterval);
        const params = obtenerDatos(); const results = ejecutarModelo(params, conCarga);
        let titulo_etiqueta = `${waveInfoData[params.signal_type].title} | Va:${params.v_a}V`;
        titulo_etiqueta += conCarga ? ` | Carga: ${params.t_l}N·m` : ` | Sin Carga`;
        simulacionActual = { params, dataVa: results.dataVa, dataW: results.dataW, dataIa: results.dataIa, label: titulo_etiqueta };

        chartVaInstance.data.datasets = [{ label: `Voltaje - ${titulo_etiqueta}`, borderColor: '#28a745', borderWidth: 2, data: results.dataVa }]; chartVaInstance.update();
        chartWInstance.data.datasets = [{ label: `Velocidad - ${titulo_etiqueta}`, borderColor: conCarga ? '#fd7e14' : '#007bff', borderWidth: 2, data: results.dataW }]; chartWInstance.update();
        chartIaInstance.data.datasets = [{ label: `Corriente - ${titulo_etiqueta}`, borderColor: conCarga ? '#fd7e14' : '#007bff', borderWidth: 2, data: results.dataIa }]; chartIaInstance.update();
        document.getElementById('btnGuardar').disabled = false;
    }

    function guardarSimulacion() {
        if (!simulacionActual) return;
        const sim = { id: simIdCounter++, params: simulacionActual.params, dataVa: simulacionActual.dataVa, dataW: simulacionActual.dataW, dataIa: simulacionActual.dataIa, color: colors[savedSimulations.length % colors.length], label: simulacionActual.label };
        savedSimulations.push(sim); actualizarTabla(); simulacionActual = null;
        document.getElementById('btnGuardar').disabled = true; mostrarGraficoIndividual(sim.id); 
    }

    function actualizarTabla() {
        const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
        savedSimulations.forEach(sim => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${sim.id}</td><td title="${sim.label}">${sim.params.signal_name}</td><td>${sim.params.v_a}</td><td>${sim.params.t_l}</td><td><button class="btn btn-show" onclick="mostrarGraficoIndividual(${sim.id})">Mostrar</button> <button class="btn btn-delete" onclick="eliminarSimulacion(${sim.id})">X</button></td>`;
            tbody.appendChild(tr);
        });
    }

    function eliminarSimulacion(id) {
        savedSimulations = savedSimulations.filter(s => s.id !== id); actualizarTabla();
        chartVaInstance.data.datasets = []; chartWInstance.data.datasets = []; chartIaInstance.data.datasets = [];
        chartVaInstance.update(); chartWInstance.update(); chartIaInstance.update();
    }

    function mostrarGraficoIndividual(id) {
        if (animacionInterval) clearInterval(animacionInterval);
        const sim = savedSimulations.find(s => s.id === id); if (!sim) return;
        chartVaInstance.data.datasets = [{ label: `Voltaje - ${sim.label}`, borderColor: sim.color, borderWidth: 2, data: sim.dataVa }]; chartVaInstance.update();
        chartWInstance.data.datasets = [{ label: `Velocidad - ${sim.label}`, borderColor: sim.color, borderWidth: 2, data: sim.dataW }]; chartWInstance.update();
        chartIaInstance.data.datasets = [{ label: `Corriente - ${sim.label}`, borderColor: sim.color, borderWidth: 2, data: sim.dataIa }]; chartIaInstance.update();
    }

    function compararGraficosAnimados() {
        if (animacionInterval) clearInterval(animacionInterval);
        if (savedSimulations.length === 0) { alert('No hay simulaciones guardadas para comparar.'); return; }

        chartVaInstance.data.datasets = savedSimulations.map(sim => ({ label: sim.label, borderColor: sim.color, borderWidth: 1.5, data: [] }));
        chartWInstance.data.datasets = savedSimulations.map(sim => ({ label: sim.label, borderColor: sim.color, borderWidth: 1.5, data: [] }));
        chartIaInstance.data.datasets = savedSimulations.map(sim => ({ label: sim.label, borderColor: sim.color, borderWidth: 1.5, data: [] }));

        let index = 0; const maxPoints = Math.max(...savedSimulations.map(sim => sim.dataW.length));
        animacionInterval = setInterval(() => {
            let endIndex = Math.min(index + 1, maxPoints);
            savedSimulations.forEach((sim, idx) => {
                chartVaInstance.data.datasets[idx].data = sim.dataVa.slice(0, endIndex);
                chartWInstance.data.datasets[idx].data = sim.dataW.slice(0, endIndex);
                chartIaInstance.data.datasets[idx].data = sim.dataIa.slice(0, endIndex);
            });
            chartVaInstance.update('none'); chartWInstance.update('none'); chartIaInstance.update('none');
            index = endIndex; if (index >= maxPoints) clearInterval(animacionInterval);
        }, 80); 
    }

    document.addEventListener("DOMContentLoaded", function() {
        actualizarInfoOnda(); // Ejecuta al inicio para esconder los que no corresponden
        let intentos = 0; let intervalo = setInterval(() => {
            if (typeof Chart !== 'undefined') { clearInterval(intervalo); initCharts(); }
            intentos++; if (intentos > 15) clearInterval(intervalo);
        }, 300);
    });
</script>
